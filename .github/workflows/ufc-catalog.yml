name: UFC catalog refresh

on:
  schedule:
    - cron: '25 11 * * *'
  workflow_dispatch:
    inputs:
      event_slug:
        description: UFCalendar event slug for a one-card fight-night refresh
        required: false
        type: string

concurrency:
  group: ufc-catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      UFCALENDAR_API_KEY: ${{ secrets.UFCALENDAR_API_KEY }}
      FIGHT_CATALOG_SERVER_KEY: ${{ secrets.FIGHT_CATALOG_SERVER_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "$UFCALENDAR_API_KEY" ] && [ -n "$FIGHT_CATALOG_SERVER_KEY" ] && [ -n "$VITE_SUPABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::UFC refresh awaits repository secrets and project URL."
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: npm ci
      - name: Refresh latest UFC cards
        if: steps.config.outputs.ready == 'true'
        env:
          UFC_EVENT_SLUG: ${{ inputs.event_slug }}
        run: |
          if [ -n "$UFC_EVENT_SLUG" ]; then
            node scripts/sync-ufc.js --publish --refresh "$UFC_EVENT_SLUG"
          else
            node scripts/sync-ufc.js --publish --refresh
          fi
