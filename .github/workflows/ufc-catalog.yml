name: UFC catalog refresh

on:
  schedule:
    - cron: '25 11 * * *'
  workflow_dispatch:
    inputs:
      event_slug:
        description: UFCalendar event slug for a one-card fight-night refresh
        required: false
        type: string
      bout_ids:
        description: One or two numeric UFCalendar bout IDs for statistics
        required: false
        type: string
      fighter_ids:
        description: Up to six numeric UFCalendar fighter IDs for profiles
        required: false
        type: string

concurrency:
  group: ufc-catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      UFCALENDAR_API_KEY: ${{ secrets.UFCALENDAR_API_KEY }}
      FIGHT_CATALOG_SERVER_KEY: ${{ secrets.FIGHT_CATALOG_SERVER_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "$UFCALENDAR_API_KEY" ] && [ -n "$FIGHT_CATALOG_SERVER_KEY" ] && [ -n "$VITE_SUPABASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::UFC refresh awaits repository secrets and project URL."
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: npm ci
      - name: Refresh UFC catalog
        if: steps.config.outputs.ready == 'true'
        env:
          UFC_EVENT_SLUG: ${{ inputs.event_slug }}
          UFC_BOUT_IDS: ${{ inputs.bout_ids }}
          UFC_FIGHTER_IDS: ${{ inputs.fighter_ids }}
        run: |
          count=0
          for input in "$UFC_EVENT_SLUG" "$UFC_BOUT_IDS" "$UFC_FIGHTER_IDS"; do
            if [ -n "$input" ]; then count=$((count + 1)); fi
          done
          if [ "$count" -gt 1 ]; then
            echo "::error::Choose only one event, bout, or fighter input."
            exit 1
          fi
          if [ -n "$UFC_BOUT_IDS" ]; then
            read -r -a ids <<< "$UFC_BOUT_IDS"
            node scripts/sync-ufc.js --publish --stats "${ids[@]}"
          elif [ -n "$UFC_FIGHTER_IDS" ]; then
            read -r -a ids <<< "$UFC_FIGHTER_IDS"
            node scripts/sync-ufc.js --publish --profiles "${ids[@]}"
          elif [ -n "$UFC_EVENT_SLUG" ]; then
            node scripts/sync-ufc.js --publish --refresh "$UFC_EVENT_SLUG"
          else
            node scripts/sync-ufc.js --publish --refresh
          fi
